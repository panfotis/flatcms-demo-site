blocks:
  -
    id: hero
    type: hero
    fields:
      heading: 'Dopamine FlatCMS'
      subheading: 'Just files. Just works.'
      lede: 'Χωρίς βάση δεδομένων, χωρίς build step, χωρίς στήσιμο. Μια σελίδα είναι ένα αρχείο, μια ενότητα ένας φάκελος — και το panel φτιάχνεται μόνο του.'
      image:
        src: ''
        alt: ''
        width: 0
        height: 0
      cta_label: 'Ξεκίνα'
      cta_url:
        page: epikoinonia
        url: ''
        target: _self
      cta2_label: 'GitHub'
      cta2_url:
        page: ''
        url: 'https://github.com/panfotis/dopamine-flatcms'
        target: _blank
      align: start
  -
    id: intro
    type: prose
    fields:
      body: '<p>Γράφεις ένα αρχείο YAML. Παίρνεις σελίδα. Αυτό. Αντιγράφεις έναν φάκελο, παίρνεις component. Το panel διαβάζει το schema σου και φτιάχνεται μόνο του — τίποτα να ρυθμίσεις, τίποτα να εγκαταστήσεις, τίποτα να αναβαθμίσεις στις 2 τα ξημερώματα.</p><p><strong>Η δομή δική σου. Το περιεχόμενο δικό τους. Τίποτα δεν χαλάει.</strong></p>'
  -
    id: scope
    type: callout
    fields:
      title: 'Όλο το CMS που χρειάζεται ο πελάτης. Χωρίς το bloat.'
      body: 'Αλλάζει κείμενα, εικόνες και περιεχόμενο σε ένα καθαρό panel — εσύ γλιτώνεις τη βάση, τα plugins και το τρέξιμο των updates. Για μικρά site, 3 έως 15 σελίδες. Θες blog, eshop, λογαριασμούς χρηστών; Αυτό είναι δουλειά για πλήρες CMS — αυτό εδώ δεν είναι, επίτηδες.'
  -
    id: features
    type: feature_grid
    fields:
      heading: 'Τι παίρνεις'
      cards:
        -
          title: 'Χωρίς βάση δεδομένων'
          body: 'Μία σελίδα = ένα αρχείο, με ιστορικό στο Git.'
          chips: 'yaml, git'
          color: lilac
        -
          title: 'Panel από το schema'
          body: 'Το admin χτίζεται μόνο του από το schema κάθε component.'
          chips: 'schema.yml'
          color: sky
        -
          title: 'Components'
          body: 'Αντιγράφεις έναν φάκελο, παίρνεις ενότητα. Χωρίς registration.'
          chips: 'schema + twig'
          color: peach
        -
          title: 'Cloudflare Access'
          body: 'Κανένας κωδικός να χαθεί — login με το email της ομάδας.'
          chips: 'zero-trust'
          color: mint
        -
          title: 'Media στο git — ή σε R2'
          body: 'Τα uploads μπαίνουν στο git μαζί με το περιεχόμενο και σερβίρονται ως responsive WebP. Για πολλά media, ένα flag τα μεταφέρει στο Cloudflare R2.'
          chips: 'git, r2, webp'
          color: lemon
        -
          title: 'Revisions'
          body: 'Κάθε αποθήκευση κρατά έκδοση που επαναφέρεις με ένα κλικ.'
          chips: 'restore'
          color: rose
        -
          title: 'Φόρμες'
          body: 'CSRF, honeypot, προαιρετικό Turnstile. Αποθηκεύονται και στέλνονται με email.'
          chips: 'honeypot'
          color: lime
        -
          title: 'Πολυγλωσσικό'
          body: 'Slugs ανά γλώσσα: /contact και /el/epikoinonia.'
          chips: 'el, en'
          color: lilac
        -
          title: 'Γρήγορο by default'
          body: 'Χωρίς queries, χωρίς bloat — και full-page CDN cache με Cloudflare μπροστά.'
          chips: 'no build'
          color: sky
  -
    id: client
    type: text_image
    fields:
      heading: 'Ο πελάτης αλλάζει μόνο κείμενα'
      body: '<p>Δεν υπάρχει κουμπί «προσθήκη ενότητας». Δεν υπάρχει drag &amp; drop. Ο πελάτης βλέπει τα πεδία που του δίνεις — τίποτα άλλο. Η σελίδα που σχεδίασες μένει η σελίδα που σχεδίασες.</p>'
      image:
        src: /uploads/2026/08/pexels-zetong-li-880728-13724339.jpg
        alt: 'Ορεινό τοπίο το σούρουπο'
        width: 1920
        height: 1440
      media_side: end
  -
    id: faq
    type: faq
    fields:
      heading: 'Συχνές ερωτήσεις'
      open_first: true
      questions:
        -
          question: 'Μπορεί ο πελάτης να χαλάσει τη σελίδα;'
          answer: '<p>Όχι. Αλλάζει μόνο κείμενα και εικόνες μέσα στα πεδία που του δίνετε.</p>'
        -
          question: 'Χρειάζεται βάση δεδομένων;'
          answer: '<p>Όχι. Κάθε σελίδα είναι ένα αρχείο YAML.</p>'
        -
          question: 'Οι φόρμες έχουν προστασία από spam;'
          answer: '<p>Ναι — CSRF token, honeypot και προαιρετικό Cloudflare Turnstile. Τα μηνύματα αποθηκεύονται και στέλνονται με email.</p>'
        -
          question: 'Αν ο πελάτης σβήσει κάτι κατά λάθος;'
          answer: '<p>Κάθε αποθήκευση κρατά revision που επαναφέρεται, και το περιεχόμενο ζει στο Git.</p>'
        -
          question: 'Πολλές γλώσσες;'
          answer: '<p>Ναι, με ξεχωριστά slugs ανά γλώσσα — αυτό το site σερβίρει /contact στα αγγλικά και /el/epikoinonia στα ελληνικά.</p>'
  -
    id: gallery
    type: gallery
    fields:
      heading: 'Δουλειές μας'
      photos:
        -
          src: /uploads/2026/08/pexels-willianjusten-30929497.jpg
          alt: 'Άνθρωπος μπροστά σε λίμνη κάτω από εντυπωσιακά σύννεφα'
          width: 3859
          height: 2573
        -
          src: /uploads/2026/08/pexels-zetong-li-880728-13724339.jpg
          alt: 'Αεροφωτογραφία χιονισμένου τοπίου με χρυσαφί βλάστηση'
          width: 1920
          height: 1440
  -
    id: video
    type: video
    fields:
      heading: 'Δείτε πώς δουλεύει'
      embed:
        provider: youtube
