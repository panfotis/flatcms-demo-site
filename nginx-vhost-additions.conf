# Additions for dopamine-flatcms-demo.fotispan.gr, a CloudPanel site.
#
# CloudPanel generates the server block — listen, SSL, server_name and the
# PHP-FPM handler for this site's own pool. Do NOT paste a second server {}
# here; add only the directives below, inside the existing one, via
# CloudPanel -> site -> Vhost editor.
#
# First, in the site's Settings, set Root Directory to:
#   htdocs/dopamine-flatcms-demo.fotispan.gr/public
# so content/, vendor/ and config.php stay above the docroot and are never
# reachable over HTTP.
#
# PHP-FPM runs as the site user, not www-data. Everything the panel writes —
# var/cache, var/locks, and CONTENT_PATH — must be owned by that user.

# The real visitor address, and the reason the contact form's rate limiter
# works at all. Behind Cloudflare every request arrives from Cloudflare, so a
# per-IP counter keyed on REMOTE_ADDR rate-limits the entire internet as one
# bucket — five submissions a day for everybody, worldwide.
#
# nginx checks who it is talking to before believing CF-Connecting-IP, so the
# header cannot be forged by anyone reaching the origin directly. PHP then sees
# a REMOTE_ADDR that is already correct and trusts nothing.
#
# Create the file before reloading or nginx will not start, and refresh it from
# cron — the ranges change, and a stale list silently reverts you to one bucket:
#   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6 \
#     | sed 's/^/set_real_ip_from /; s/$/;/' > /etc/nginx/cloudflare-ips.conf
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Pretty URLs: every path that is not a real file goes to index.php, which
# resolves it against content/pages/<locale>/*.yml by slug.
location / {
    try_files $uri $uri/ /index.php$is_args$args;
}

# The panel is never cached anywhere. Cloudflare Access sits in front of this
# path in production; PHP verifies the Access JWT so the origin cannot be hit
# directly.
location = /admin.php {
    add_header Cache-Control "no-store, private" always;
}

# CONTENT_PATH, not the checkout: the panel writes here, and it must survive
# every git pull. An alias rather than a symlink, so nothing inside public/
# points outside it and stored `src` values stay /uploads/... either way.
#
# Keep this even with R2_ENABLED=1. New uploads get absolute bucket URLs and
# never reach this server, but every image saved before the switch is still
# referenced as /uploads/... — drop this block and the demo 404s its own
# pictures.
location /uploads/ {
    alias /home/fotispan-dopamine-flatcms-demo/content/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    # Uploaded files are never executed, whatever their extension. This is the
    # reason the directory must not be reachable by any other path.
    location ~ \.php$ { return 403; }
}

# Belt and braces: block dotfiles and any stray YAML under the docroot.
location ~ /\.        { deny all; }
location ~ \.ya?ml$   { deny all; }

client_max_body_size 16m;

# Generated CSS/JS bundles — content-addressed, so cache forever. php-fpm
# writes here at runtime; the execute guard is why that is safe.
location /assets/ {
    alias /home/fotispan-dopamine-flatcms-demo/shared/assets/;
    expires max;
    add_header Cache-Control "public, immutable";
    location ~ \.php$ { return 403; }
}
